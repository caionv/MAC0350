<!DOCTYPE html>
<html>
<head>
    <title>Cadastro</title>
</head>
<body>
    <h1>Cadastrar Novo Usuário</h1>
    <form>
        <input type="text" id="nome" placeholder="Nome"><br><br>
        <input type="password" id="senha" placeholder="Senha"><br><br>
        <input type="text" id="bio" placeholder="Bio"><br><br>
        <button type="button" onclick="criarUser()">Cadastrar</button>
    </form>
    <br>
    <a href="/login">Ir para Login</a>

    <script>
        async function criarUser() {
            const dados = {
                nome: document.getElementById('nome').value,
                senha: document.getElementById('senha').value,
                bio: document.getElementById('bio').value
            };

            const resposta = await fetch('/users', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(dados)
            });

            if (resposta.ok) {
                alert("Criado com sucesso!");
            } else {
                alert("Erro ao criar.");
            }
        }
    </script>
</body>
</html>
