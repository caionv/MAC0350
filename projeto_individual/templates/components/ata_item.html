<div class="ata-item" id="ata-{{ ata.id }}">
    <div>
        <h4 style="margin-top: 0; margin-bottom: 0.5rem; color: var(--primary-blue);">{{ ata.title }}</h4>
        <div class="ata-meta">
            Publicado em {{ ata.date }} por {{ ata.author.name if ata.author else 'Desconhecido' }}
        </div>
    </div>
    <div style="margin-bottom: 1rem; line-height: 1.5; white-space: pre-wrap;">{{ ata.content }}</div>
    
    <div class="ata-actions">
        <button class="btn btn-edit" hx-get="/atas/{{ ata.id }}/edit" hx-target="#ata-{{ ata.id }}" hx-swap="outerHTML">Editar</button>
        <button class="btn btn-danger" hx-delete="/atas/{{ ata.id }}" hx-target="#ata-{{ ata.id }}" hx-swap="outerHTML" hx-confirm="Tem certeza que deseja apagar esta ata?">Apagar</button>
    </div>
</div>
